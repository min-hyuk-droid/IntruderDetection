plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.photoviewer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.photoviewer'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        // 서버 주소만 넣는다. 토큰은 앱에 넣지 않고 로그인으로 받는다 (SecureTokenStore)
        buildConfigField 'String', 'LOCAL_URL', '"http://10.0.2.2:8000"'  // 에뮬레이터에서 PC 의 127.0.0.1
        buildConfigField 'String', 'REMOTE_URL', '"https://sungmh.pythonanywhere.com"'

        // 온디바이스 인식 라이브러리: 휴대폰(arm64)과 에뮬레이터(x86_64)만 포함해 APK 크기를 줄임
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.31.1'  // [편의기능] 온디바이스 YOLOv5 실행
    testImplementation 'junit:junit:4.13.2'
    // 단위 테스트(JVM)에서는 안드로이드의 org.json 이 비어 있으므로 실제 구현을 넣음
    testImplementation 'org.json:json:20260814'
    // [편의기능] 침입 기록 저장소(SQLite)는 에뮬레이터·휴대폰에서 시험 (connectedDebugAndroidTest)
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
